version: "3.9"

services:
  ats-parser:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ats-simulator-br
    volumes:
      - ./curriculos:/app/curriculos:ro
      - ./output:/app/output
    environment:
      - PYTHONPATH=/app
      - PYTHONUNBUFFERED=1
    # Override do entrypoint para manter container vivo em dev
    # entrypoint: ["tail", "-f", "/dev/null"]

